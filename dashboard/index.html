<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textbook Lead Desk</title>
<style>
/* ---------------------------------------------------------------------------
   Ledger stock and printer's ink. Neutrals carry a slight green bias so they sit
   with the accent. Red is reserved for deadlines closing soon — nothing else on
   the page is allowed to be red, so urgency stays a signal instead of a theme.
   --------------------------------------------------------------------------- */
:root {
  --ground:        #f6f6f3;
  --surface:       #fffffd;
  --surface-2:     #eeeee9;
  --line:          #d9dad3;
  --line-strong:   #b9bbb2;
  --ink:           #191c19;
  --ink-2:         #4b514b;
  --ink-3:         #767c74;
  --accent:        #1d5c4b;
  --accent-soft:   #dcebe4;
  --urgent:        #a3341f;
  --urgent-soft:   #f7e2dc;
  --soon:          #8a5a12;
  --soon-soft:     #f7ecd8;
  --open:          #2d6046;
  --open-soft:     #dfeee4;
  --shadow:        0 1px 2px rgba(25, 28, 25, .06), 0 8px 24px -18px rgba(25, 28, 25, .5);
  --radius:        6px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141715; --surface: #1b1f1c; --surface-2: #242926;
    --line: #333934; --line-strong: #4b524c;
    --ink: #e8eae6; --ink-2: #b3b9b2; --ink-3: #868d86;
    --accent: #6fcfae; --accent-soft: #1f332b;
    --urgent: #f0937a; --urgent-soft: #3a221c;
    --soon: #e3b263; --soon-soft: #352a17;
    --open: #7fc9a3; --open-soft: #1d2f25;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px #000;
  }
}
:root[data-theme="dark"] {
  --ground: #141715; --surface: #1b1f1c; --surface-2: #242926;
  --line: #333934; --line-strong: #4b524c;
  --ink: #e8eae6; --ink-2: #b3b9b2; --ink-3: #868d86;
  --accent: #6fcfae; --accent-soft: #1f332b;
  --urgent: #f0937a; --urgent-soft: #3a221c;
  --soon: #e3b263; --soon-soft: #352a17;
  --open: #7fc9a3; --open-soft: #1d2f25;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px #000;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ground); color: var(--ink); font-family: var(--sans);
  font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 600; text-wrap: balance; }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 72px; }

.masthead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px;
  padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.masthead h1 { font-size: 27px; letter-spacing: -.01em; }
.masthead .sub { color: var(--ink-3); font-size: 13px; }
.masthead .spacer { flex: 1; }
.stamp { font-family: var(--mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: .09em; color: var(--ink-3); }

/* Tabs: built once, only counts and selection change afterwards, so keyboard
   focus survives every interaction. "Skip these" is deliberately quieter and
   pushed right — it is a reference list, not a peer of the lead lists. */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 18px 0 0; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 1px solid transparent; border-bottom: none;
  border-radius: var(--radius) var(--radius) 0 0; padding: 9px 14px; font-size: 14px;
  color: var(--ink-3); margin-bottom: -1px; cursor: pointer; }
.tab b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--surface); border-color: var(--line);
  color: var(--ink); font-weight: 600; }
.tab:hover { color: var(--accent); }
.tab.muted { margin-left: auto; font-size: 12.5px; }
.tab.muted b { font-size: 13px; }
.tab-blurb { color: var(--ink-2); font-size: 13.5px; margin: 12px 2px 4px; max-width: 76ch; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; align-items: center; }
.filters [hidden] { display: none !important; }
input[type="search"], select {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 4px; padding: 6px 9px; }
input[type="search"] { min-width: 230px; }
button { font: inherit; font-size: 13px; cursor: pointer; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line-strong);
  border-radius: 4px; padding: 6px 11px; }
button:hover { border-color: var(--accent); color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count-note { color: var(--ink-3); font-size: 13px; margin: 8px 2px 12px; font-variant-numeric: tabular-nums; }

.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 700px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
  font-family: var(--mono); font-weight: 500; color: var(--ink-3); padding: 9px 12px;
  border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface);
  position: sticky; top: 0; z-index: 1; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:hover { background: var(--surface-2); }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.org-name { font-weight: 600; }
.org-meta { color: var(--ink-3); font-size: 12.5px; }

.pill { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px;
  border: 1px solid transparent; white-space: nowrap; }
.pill.type { background: var(--surface-2); color: var(--ink-2); border-color: var(--line); }
.pill.urgent { background: var(--urgent-soft); color: var(--urgent); }
.pill.soon { background: var(--soon-soft); color: var(--soon); }
.pill.open { background: var(--open-soft); color: var(--open); }
.pill.flag { background: var(--accent-soft); color: var(--accent); }

/* Contact cell: the email/phone is a real link (mailto:/tel:), the small ⧉
   button copies. Both are visibly interactive and comfortably tappable. */
.contact a { font-family: var(--mono); font-size: 12.5px; text-decoration: none;
  border-bottom: 1px solid var(--accent-soft); }
.contact a:hover { border-color: var(--accent); }
.copy { font-family: var(--mono); font-size: 11px; padding: 2px 7px; margin-left: 5px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px;
  color: var(--ink-2); cursor: pointer; }
.copy:hover { border-color: var(--accent); color: var(--accent); }
.copy.copied { color: var(--open); border-color: var(--open); }
.copy.failed { color: var(--urgent); border-color: var(--urgent); }

.cards { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.card-meta { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.card-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.card .act { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px 14px;
  font-size: 14px; align-items: center; }
.card .act a { padding: 4px 0; }

.status { padding: 40px 0; text-align: center; color: var(--ink-3); }
.status code { font-family: var(--mono); font-size: 12.5px; }
footer { margin-top: 28px; color: var(--ink-3); font-size: 12.5px;
  border-top: 1px solid var(--line); padding-top: 12px; max-width: 90ch; }

@media (max-width: 720px) {
  .wrap { padding: 16px 14px 56px; }
  .table-scroll { display: none; }
  .cards { display: block; }
  .masthead h1 { font-size: 22px; }
  .tab.muted { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>Textbook Lead Desk</h1>
    <span class="sub">Who to call, who's bidding, who to skip — university and above</span>
    <span class="spacer"></span>
    <span class="stamp" id="stamp">loading</span>
  </header>

  <div class="tabs" id="tabs"></div>
  <p class="tab-blurb" id="blurb"></p>

  <div class="filters">
    <input type="search" id="q" placeholder="Search">
    <select id="state"><option value="">All states</option></select>
    <label id="healthWrap" style="font-size:13px;color:var(--ink-2)">
      <input type="checkbox" id="health" style="accent-color:var(--accent)"> Nursing / allied health
    </label>
    <button type="button" id="reset">Reset</button>
  </div>

  <p class="count-note" id="countNote"></p>
  <div id="status" class="status">Loading leads.db…</div>
  <div class="table-scroll"><table id="grid"><thead id="gridHead"></thead><tbody id="gridBody"></tbody></table></div>
  <div class="cards" id="cards"></div>

  <footer id="footer"></footer>
</div>

<script>
/* ---------------------------------------------------------------------------
   Data. Two paths, one shape: sql.js over ./leads.db, or the embedded
   window.__LEADS_DATA__ inlined by build_static.py.

   The bids query enforces the tab's own promise: physical materials only, no
   subscription/database renewals, no K-12 buyers. The ingest pipeline filters
   at the source too — this is the belt to that braces, so a stale database can
   never put an unfulfillable row in front of a rep.
   --------------------------------------------------------------------------- */
const SQL_JS = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/";
const DB_CANDIDATES = ["./leads.db", "../db/leads.db"];

const ORG_SQL = `
  SELECT o.id, o.name, o.org_type, o.track, o.segment, o.website_domain AS domain,
         o.state, o.city, o.size_metric AS size, o.programs_flags AS flags,
         o.notes AS notes, o.status, o.coop_affiliations AS coops
    FROM organizations o`;
const CONTACT_SQL = `SELECT org_id, role_type, email, phone FROM contacts`;
const SIGNAL_SQL = `
  SELECT s.id, s.title, s.url, s.reference_number AS ref, s.deadline, s.source, s.state,
         COALESCE(o.name, s.org_name_raw) AS org_name
    FROM signals s LEFT JOIN organizations o ON o.id = s.org_id
   WHERE s.status = 'open' AND s.deadline >= date('now')
     AND lower(s.title) NOT LIKE '%subscription%'
     AND lower(s.title) NOT LIKE '%journal%'
     AND lower(s.title) NOT LIKE '%web hosting%'
     AND lower(s.title) NOT LIKE '%database%'
     AND lower(s.title) NOT LIKE '%annual review%'
     AND lower(s.title) NOT LIKE '%intent to award%'
     AND lower(s.title) NOT LIKE '%marker%'
     AND lower(s.title) NOT LIKE '%k-12%'
     AND lower(s.title) NOT LIKE '%k12%'
     AND lower(s.title) NOT LIKE '%elementary%'
     AND lower(s.title) NOT LIKE '%middle school%'
     AND lower(s.title) NOT LIKE '%high school%'
     AND lower(COALESCE(o.name, s.org_name_raw, '')) NOT LIKE '%school%'
     AND lower(COALESCE(o.name, s.org_name_raw, '')) NOT LIKE '%board of education%'`;
const FRESH_SQL = `
  SELECT MAX(d) FROM (SELECT MAX(date(date_updated)) AS d FROM organizations
                      UNION ALL SELECT MAX(date(date_updated)) FROM signals)`;

let DATA = { orgs: [], contacts: [], signals: [], meta: {} };

function loadScript(src) {
  return new Promise((ok, fail) => {
    const el = document.createElement("script");
    el.src = src; el.onload = ok; el.onerror = () => fail(new Error("cannot load " + src));
    document.head.appendChild(el);
  });
}
async function fetchDb() {
  for (const path of DB_CANDIDATES) {
    try { const res = await fetch(path); if (res.ok) return new Uint8Array(await res.arrayBuffer()); }
    catch (err) { /* next */ }
  }
  throw new Error("leads.db not found next to this page");
}
function rows(db, sql) {
  const out = []; const stmt = db.prepare(sql);
  while (stmt.step()) out.push(stmt.getAsObject());
  stmt.free(); return out;
}
async function load() {
  if (window.__LEADS_DATA__) { DATA = window.__LEADS_DATA__; return; }
  await loadScript(SQL_JS + "sql-wasm.js");
  const SQL = await initSqlJs({ locateFile: f => SQL_JS + f });
  const db = new SQL.Database(await fetchDb());
  DATA = { orgs: rows(db, ORG_SQL), contacts: rows(db, CONTACT_SQL),
           signals: rows(db, SIGNAL_SQL),
           meta: { data_date: (db.exec(FRESH_SQL)[0] || {}).values?.[0]?.[0] || null } };
}

/* --- helpers --------------------------------------------------------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/�/g, "–").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = n => (n == null ? "—" : Math.round(n).toLocaleString("en-US"));
const parseJson = (v, fb) => { if (v == null) return fb; if (typeof v === "object") return v;
  try { return JSON.parse(v); } catch (e) { return fb; } };
const daysTo = iso => iso ? Math.round((new Date(iso + "T00:00:00") - new Date().setHours(0,0,0,0)) / 864e5) : null;
const HEALTH = ["nursing", "allied_health", "medical", "pharmacy"];
const RENDER_CAP = 300;

function deadlinePill(iso) {
  if (!iso) return '<span class="pill type">no deadline</span>';
  const d = daysTo(iso);
  const cls = d <= 14 ? "urgent" : d <= 45 ? "soon" : "open";
  return `<span class="pill ${cls}">${esc(iso)} · ${d}d</span>`;
}
/* Email and phone are real links — one tap mails or dials. ⧉ copies. */
function emailLink(v) {
  return v ? `<span class="contact"><a href="mailto:${esc(v)}">${esc(v)}</a><button
    class="copy" data-copy="${esc(v)}" title="copy">⧉</button></span>` : "";
}
function phoneLink(v) {
  if (!v) return "";
  const tel = String(v).replace(/[^\d+]/g, "");
  return `<span class="contact"><a href="tel:${esc(tel)}">${esc(v)}</a><button
    class="copy" data-copy="${esc(v)}" title="copy">⧉</button></span>`;
}
function copyBtn(text, label) {
  if (!text) return '<span class="org-meta">—</span>';
  return `<span class="contact"><a href="#" onclick="return false">${esc(label || text)}</a><button
    class="copy" data-copy="${esc(text)}" title="copy">⧉</button></span>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".copy");
  if (!btn) return;
  const done = ok => {
    btn.textContent = ok ? "✓" : "×"; btn.classList.add(ok ? "copied" : "failed");
    setTimeout(() => { btn.textContent = "⧉"; btn.classList.remove("copied", "failed"); }, 1100);
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(btn.dataset.copy).then(() => done(true), () => done(false));
  } else { done(false); }
});

/* ---------------------------------------------------------------------------
   Views. Each declares which filters apply to it; controls that do nothing on
   a tab are hidden on that tab. Tab count always equals the rows in the table.
   --------------------------------------------------------------------------- */
let VIEWS = [];

function healthFlags(o) { const f = parseJson(o.flags, {}); return HEALTH.filter(k => f[k]); }
function isHealth(o) { return healthFlags(o).length > 0; }
const reachRank = s => (s.email ? 2 : s.phone ? 1 : 0);

function buildViews() {
  const contactsByOrg = new Map();
  for (const c of DATA.contacts) {
    if (!contactsByOrg.has(c.org_id)) contactsByOrg.set(c.org_id, []);
    contactsByOrg.get(c.org_id).push(c);
  }

  /* Campus stores: independent = local buying decision. Reachable first. */
  const storeLeads = [], storeLocked = [];
  for (const o of DATA.orgs) {
    const store = parseJson(o.notes, {}).store;
    if (!store) continue;
    if (store.kind === "managed") storeLocked.push({ o, store });
    else if ((store.kind === "independent" || store.kind === "external")
             && (store.email || store.phone)) storeLeads.push({ o, store });
  }
  storeLeads.sort((a, b) => reachRank(b.store) - reachRank(a.store) || (b.o.size || 0) - (a.o.size || 0));

  const bids = [...DATA.signals].sort((a, b) => (a.deadline || "9999").localeCompare(b.deadline || "9999"));

  /* Surplus buyers: only counterparties we can actually reach today. */
  const surplus = DATA.orgs
    .filter(o => (o.track === "B" || o.track === "both") && o.status !== "disqualified")
    .map(o => ({ o, contacts: contactsByOrg.get(o.id) || [] }))
    .filter(x => x.contacts.length)
    .sort((a, b) => String(a.o.name).localeCompare(b.o.name));

  const libraries = DATA.orgs
    .map(o => ({ o, contacts: (contactsByOrg.get(o.id) || []).filter(c => c.role_type === "acquisitions_librarian") }))
    .filter(x => x.contacts.length)
    .sort((a, b) => (b.o.size || 0) - (a.o.size || 0));

  const incumbents = DATA.orgs
    .filter(o => parseJson(o.notes, {}).federal_total_usd != null && o.status === "disqualified")
    .map(o => ({ o, note: parseJson(o.notes, {}) }))
    .sort((a, b) => b.note.federal_total_usd - a.note.federal_total_usd);
  const locked = [...storeLocked.map(x => ({ kind: "store", ...x })),
                  ...incumbents.map(x => ({ kind: "incumbent", ...x }))];

  VIEWS = [
    {
      key: "stores", label: "Campus stores", rows: storeLeads,
      blurb: "Institutions running their own store — the buying decision is on campus. Email or phone is one tap. Lead with used/bulk pricing on core adoption titles.",
      filters: ["q", "state", "health"], search: "Search school, city, email",
      head: ["Institution", "State", "Enrollment", "Programs", "Store", "Contact"],
      render: renderStoreRow, card: cardStore,
      match: ({ o }, f) => matchOrg(o, f),
      emptyData: "No independent campus stores found yet — the campus crawl is still filling this list.",
    },
    {
      key: "bids", label: "Live bids", rows: bids,
      blurb: "Open solicitations for physical books and course materials, university and above, soonest deadline first. Subscription renewals and K-12 bids never appear here.",
      filters: ["q", "state"], search: "Search title, buyer, reference",
      head: ["Deadline", "Buyer", "Solicitation", "Reference", "Source"],
      render: renderBidRow, card: cardBid,
      match: (s, f) => matchBid(s, f),
      emptyData: "Nothing fulfillable is open right now. The pollers run every day — an empty list is honest, not broken.",
    },
    {
      key: "surplus", label: "Surplus buyers", rows: surplus,
      blurb: "Wholesalers and buyback programs that purchase overstock, each with a published mailbox — buybacks@ and bids@ exist to receive exactly this pitch.",
      filters: ["q"], search: "Search company, email",
      head: ["Company", "Type", "What they do", "Reach them"],
      render: renderSurplusRow, card: cardSurplus,
      match: ({ o, contacts }, f) => matchOrg(o, f, contacts),
      emptyData: "No reachable surplus buyers in the database.",
    },
    {
      key: "libraries", label: "Library accounts", rows: libraries,
      blurb: "Secondary play: consortium libraries with published acquisitions addresses. They buy monographs and reference, not adoption stock — pitch health-sciences backlist.",
      filters: ["q", "state", "health"], search: "Search institution, city",
      head: ["Institution", "State", "Enrollment", "Consortium", "Acquisitions contact"],
      render: renderLibraryRow, card: cardLibrary,
      match: ({ o }, f) => matchOrg(o, f),
      emptyData: "No library contacts in the database.",
    },
    {
      key: "locked", label: "Skip these", rows: locked, muted: true,
      blurb: "Campuses whose store is run centrally (Follett, Barnes & Noble College) and the incumbents holding federal subscription contracts. Not leads — here so nobody spends a week finding out.",
      filters: ["q", "state"], search: "Search organization",
      head: ["Organization", "Why to skip", "Detail"],
      render: renderLockedRow, card: cardLocked,
      match: (x, f) => matchOrg(x.o, f),
      emptyData: "Nothing recorded here yet.",
    },
  ];
}

/* --- filtering ---------------------------------------------------------------- */
function filters() {
  return { q: $("q").value.trim().toLowerCase(), st: $("state").value, health: $("health").checked };
}
function activeFilterCount(view, f) {
  let n = 0;
  if (view.filters.includes("q") && f.q) n++;
  if (view.filters.includes("state") && f.st) n++;
  if (view.filters.includes("health") && f.health) n++;
  return n;
}
function matchOrg(o, f, contacts) {
  const view = VIEWS.find(v => v.key === state.tab);
  if (view.filters.includes("state") && f.st && o.state !== f.st) return false;
  if (view.filters.includes("health") && f.health && !isHealth(o)) return false;
  if (f.q) {
    const store = parseJson(o.notes, {}).store || {};
    const emails = (contacts || []).map(c => c.email).join(" ");
    const hay = `${o.name} ${o.city || ""} ${o.domain || ""} ${store.email || ""} ${emails}`.toLowerCase();
    if (!hay.includes(f.q)) return false;
  }
  return true;
}
function matchBid(s, f) {
  if (f.st && s.state !== f.st) return false;
  if (f.q && !`${s.title} ${s.org_name || ""} ${s.ref || ""}`.toLowerCase().includes(f.q)) return false;
  return true;
}

/* --- row renderers -------------------------------------------------------------- */
function contactCell(store) {
  const parts = [];
  if (store.email) parts.push(emailLink(store.email));
  if (store.phone) parts.push(phoneLink(store.phone));
  return parts.join("<br>") || '<span class="org-meta">—</span>';
}
function renderStoreRow({ o, store }) {
  return `<tr>
    <td><div class="org-name">${esc(o.name)}</div><div class="org-meta">${esc(o.city || "")}</div></td>
    <td>${esc(o.state || "—")}</td>
    <td class="num">${num(o.size)}</td>
    <td>${healthFlags(o).map(x => `<span class="pill flag">${esc(x.replace("_", " "))}</span>`).join(" ") || '<span class="org-meta">—</span>'}</td>
    <td>${store.store_url ? `<a href="${esc(store.store_url)}" target="_blank" rel="noopener">site</a>` : "—"}</td>
    <td>${contactCell(store)}</td>
  </tr>`;
}
function cardStore({ o, store }) {
  return `<article class="card">
    <div class="org-name">${esc(o.name)}</div>
    <div class="card-meta">${esc(o.city || "")}${o.state ? ", " + esc(o.state) : ""} · ${num(o.size)} enrolled</div>

}

/* Skip these: the reason is plain text — red stays reserved for deadlines. */
function renderLockedRow(x) {

/* --- shell ------------------------------------------------------------------------ */
const state = { tab: "stores" };

function buildTabs() {
  $("tabs").innerHTML = VIEWS.map(v =>
    `<button class="tab${v.muted ? " muted" : ""}" aria-selected="${v.key === state.tab}"
             data-tab="${v.key}">${esc(v.label)}<b data-count></b></button>`).join("");
  $("tabs").addEventListener("click", e => {
    const tab = e.target.closest(".tab");
    if (!tab || tab.dataset.tab === state.tab) return;
    state.tab = tab.dataset.tab;
    for (const el of document.querySelectorAll(".tab"))
      el.setAttribute("aria-selected", String(el.dataset.tab === state.tab));
    render();
  });
}

function render() {
  const f = filters();
  const view = VIEWS.find(v => v.key === state.tab);

  /* counts on every tab reflect exactly what that tab renders */
  for (const el of document.querySelectorAll(".tab")) {
    const v = VIEWS.find(x => x.key === el.dataset.tab);
    el.querySelector("[data-count]").textContent = v.rows.length.toLocaleString();
  }
  $("blurb").textContent = view.blurb;

  /* only the filters this view uses are visible */
  $("q").placeholder = view.search;
  $("state").hidden = !view.filters.includes("state");
  $("healthWrap").hidden = !view.filters.includes("health");

  const visible = view.rows.filter(r => view.match(r, f));
  $("gridHead").innerHTML = `<tr>${view.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>`;
  const filtered = activeFilterCount(view, f) > 0;
  const emptyMsg = view.rows.length && filtered
    ? "0 rows match your filters — press Reset to clear them."
    : view.emptyData;
  $("gridBody").innerHTML = visible.length
    ? visible.slice(0, RENDER_CAP).map(view.render).join("")
    : `<tr><td colspan="${view.head.length}" class="org-meta" style="padding:16px">${esc(emptyMsg)}</td></tr>`;
  $("cards").innerHTML = visible.length
    ? visible.slice(0, RENDER_CAP).map(view.card).join("")
    : `<p class="org-meta">${esc(emptyMsg)}</p>`;
  const shown = Math.min(visible.length, RENDER_CAP);
  $("countNote").textContent = `${visible.length.toLocaleString()} of ${view.rows.length.toLocaleString()} rows`
    + (visible.length > shown ? ` — showing the first ${shown}.` : ".");
}

function wire() {
  ["q", "state", "health"].forEach(id => $(id).addEventListener("input", render));
  $("reset").addEventListener("click", () => {
    $("q").value = ""; $("state").value = ""; $("health").checked = false; render();
  });
}

load().then(() => {
  $("status").hidden = true;
  buildViews();
  const states = [...new Set(DATA.orgs.map(o => o.state).filter(Boolean))].sort();
  $("state").insertAdjacentHTML("beforeend",
    states.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join(""));
  buildTabs();
  wire();
  render();
  const leads = VIEWS[0].rows.length + VIEWS[2].rows.length;
  const fresh = DATA.meta.data_date || DATA.meta.generated;
  $("stamp").textContent = `${leads} leads · ${VIEWS[1].rows.length} bids · data ${fresh || "date unknown"}`;
  $("footer").innerHTML =
    `Campus store operator and contact from each institution's own site; bids from SAM.gov and the
     Georgia and Florida procurement portals (physical materials, university and above only);
     surplus buyers from a verified trade list; library contacts from OhioLINK. All contacts are
     organizational mailboxes the organizations publish themselves. Data as of ${esc(fresh || "—")}.`;
}).catch(err => {
  $("status").innerHTML = `<p>Could not load the database.</p><p><code>${esc(err.message)}</code></p>
    <p class="org-meta">Serve this folder over HTTP — <code>python -m http.server</code> from the repo
    root, then open <code>/dashboard/</code>.</p>`;
});
</script>
