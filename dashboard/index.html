<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textbook Lead Desk</title>
<style>
/* ---------------------------------------------------------------------------
   Ledger stock and printer's ink. Neutrals carry a slight green bias so they sit
   with the accent. Semantic colours (urgent/soon/open) only ever mean deadline;
   good/bad pills (lead / locked) reuse open/urgent tones deliberately.
   --------------------------------------------------------------------------- */
:root {
  --ground:        #f6f6f3;
  --surface:       #fffffd;
  --surface-2:     #eeeee9;
  --line:          #d9dad3;
  --line-strong:   #b9bbb2;
  --ink:           #191c19;
  --ink-2:         #4b514b;
  --ink-3:         #767c74;
  --accent:        #1d5c4b;
  --accent-soft:   #dcebe4;
  --urgent:        #a3341f;
  --urgent-soft:   #f7e2dc;
  --soon:          #8a5a12;
  --soon-soft:     #f7ecd8;
  --open:          #2d6046;
  --open-soft:     #dfeee4;
  --shadow:        0 1px 2px rgba(25, 28, 25, .06), 0 8px 24px -18px rgba(25, 28, 25, .5);
  --radius:        6px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141715; --surface: #1b1f1c; --surface-2: #242926;
    --line: #333934; --line-strong: #4b524c;
    --ink: #e8eae6; --ink-2: #b3b9b2; --ink-3: #868d86;
    --accent: #6fcfae; --accent-soft: #1f332b;
    --urgent: #f0937a; --urgent-soft: #3a221c;
    --soon: #e3b263; --soon-soft: #352a17;
    --open: #7fc9a3; --open-soft: #1d2f25;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px #000;
  }
}
:root[data-theme="dark"] {
  --ground: #141715; --surface: #1b1f1c; --surface-2: #242926;
  --line: #333934; --line-strong: #4b524c;
  --ink: #e8eae6; --ink-2: #b3b9b2; --ink-3: #868d86;
  --accent: #6fcfae; --accent-soft: #1f332b;
  --urgent: #f0937a; --urgent-soft: #3a221c;
  --soon: #e3b263; --soon-soft: #352a17;
  --open: #7fc9a3; --open-soft: #1d2f25;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -20px #000;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ground); color: var(--ink); font-family: var(--sans);
  font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 600; text-wrap: balance; }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 72px; }

.masthead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px;
  padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.masthead h1 { font-size: 27px; letter-spacing: -.01em; }
.masthead .sub { color: var(--ink-3); font-size: 13px; }
.masthead .spacer { flex: 1; }
.stamp { font-family: var(--mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: .09em; color: var(--ink-3); }

/* Tabs are the product: each one is a distinct play a rep can run today. */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 18px 0 0; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 1px solid transparent; border-bottom: none;
  border-radius: var(--radius) var(--radius) 0 0; padding: 9px 14px; font-size: 14px;
  color: var(--ink-3); margin-bottom: -1px; cursor: pointer; }
.tab b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; color: inherit; }
.tab[aria-selected="true"] { background: var(--surface); border-color: var(--line);
  color: var(--ink); font-weight: 600; }
.tab-blurb { color: var(--ink-2); font-size: 13.5px; margin: 12px 2px 4px; max-width: 72ch; }

.filters { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; align-items: center; }
input[type="search"], select {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 4px; padding: 6px 9px; }
input[type="search"] { min-width: 230px; }
button { font: inherit; font-size: 13px; cursor: pointer; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line-strong);
  border-radius: 4px; padding: 6px 11px; }
button:hover { border-color: var(--accent); color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count-note { color: var(--ink-3); font-size: 13px; margin: 8px 2px 12px; font-variant-numeric: tabular-nums; }

.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 720px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
  font-family: var(--mono); font-weight: 500; color: var(--ink-3); padding: 9px 12px;
  border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface);
  position: sticky; top: 0; z-index: 1; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:hover { background: var(--surface-2); }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.org-name { font-weight: 600; }
.org-meta { color: var(--ink-3); font-size: 12.5px; }

.pill { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px;
  border: 1px solid transparent; white-space: nowrap; }
.pill.type { background: var(--surface-2); color: var(--ink-2); border-color: var(--line); }
.pill.urgent { background: var(--urgent-soft); color: var(--urgent); }
.pill.soon { background: var(--soon-soft); color: var(--soon); }
.pill.open { background: var(--open-soft); color: var(--open); }
.pill.flag { background: var(--accent-soft); color: var(--accent); }

.copy { font: inherit; font-family: var(--mono); font-size: 12.5px; background: none;
  border: none; border-bottom: 1px dashed var(--line-strong); color: var(--ink);
  padding: 0 0 1px; cursor: pointer; }
.copy:hover { color: var(--accent); border-color: var(--accent); }
.copy.copied { color: var(--open); border-color: var(--open); }

.cards { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.card-meta { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.card-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.card .act { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; }

.status { padding: 40px 0; text-align: center; color: var(--ink-3); }
.status code { font-family: var(--mono); font-size: 12.5px; }
footer { margin-top: 28px; color: var(--ink-3); font-size: 12.5px;
  border-top: 1px solid var(--line); padding-top: 12px; max-width: 90ch; }

@media (max-width: 720px) {
  .wrap { padding: 16px 14px 56px; }
  .table-scroll { display: none; }
  .cards { display: block; }
  .masthead h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>Textbook Lead Desk</h1>
    <span class="sub">Every row is a call or an email a rep can make today</span>
    <span class="spacer"></span>
    <span class="stamp" id="stamp">loading</span>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>
  <p class="tab-blurb" id="blurb"></p>

  <div class="filters">
    <input type="search" id="q" placeholder="Search name, city, email">
    <select id="state"><option value="">All states</option></select>
    <label style="font-size:13px;color:var(--ink-2)">
      <input type="checkbox" id="health" style="accent-color:var(--accent)"> Nursing / allied health
    </label>
    <button type="button" id="reset">Reset</button>
  </div>

  <p class="count-note" id="countNote"></p>
  <div id="status" class="status">Loading leads.db…</div>
  <div class="table-scroll"><table id="grid"><thead id="gridHead"></thead><tbody id="gridBody"></tbody></table></div>
  <div class="cards" id="cards"></div>

  <footer id="footer"></footer>
</div>

<script>
/* ---------------------------------------------------------------------------
   Same two loading paths as before: sql.js over ./leads.db, or the embedded
   window.__LEADS_DATA__ that build_static.py inlines.
   --------------------------------------------------------------------------- */
const SQL_JS = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/";
const DB_CANDIDATES = ["./leads.db", "../db/leads.db"];

const ORG_SQL = `
  SELECT o.id, o.name, o.org_type, o.track, o.segment, o.website_domain AS domain,
         o.state, o.city, o.size_metric AS size, o.size_metric_type AS size_type,
         o.programs_flags AS flags, o.notes AS notes, o.source AS source, o.status,
         o.coop_affiliations AS coops
    FROM organizations o`;
const CONTACT_SQL = `SELECT id, org_id, name, title, role_type, email, phone, is_generic,
                            source FROM contacts`;
const SIGNAL_SQL = `
  SELECT s.id, s.org_id, s.signal_type AS type, s.title, s.url, s.reference_number AS ref,
         s.deadline, s.amount_estimate AS amount, s.source, s.state,
         COALESCE(o.name, s.org_name_raw) AS org_name
    FROM signals s LEFT JOIN organizations o ON o.id = s.org_id
   WHERE s.status = 'open' AND s.deadline >= date('now')`;

let DATA = { orgs: [], contacts: [], signals: [], meta: {} };

function loadScript(src) {
  return new Promise((ok, fail) => {
    const el = document.createElement("script");
    el.src = src; el.onload = ok; el.onerror = () => fail(new Error("cannot load " + src));
    document.head.appendChild(el);
  });
}
async function fetchDb() {
  for (const path of DB_CANDIDATES) {
    try { const res = await fetch(path); if (res.ok) return new Uint8Array(await res.arrayBuffer()); }
    catch (err) { /* next */ }
  }
  throw new Error("leads.db not found next to this page");
}
function rows(db, sql) {
  const out = []; const stmt = db.prepare(sql);
  while (stmt.step()) out.push(stmt.getAsObject());
  stmt.free(); return out;
}
async function load() {
  if (window.__LEADS_DATA__) { DATA = window.__LEADS_DATA__; return; }
  await loadScript(SQL_JS + "sql-wasm.js");
  const SQL = await initSqlJs({ locateFile: f => SQL_JS + f });
  const db = new SQL.Database(await fetchDb());
  DATA = { orgs: rows(db, ORG_SQL), contacts: rows(db, CONTACT_SQL),
           signals: rows(db, SIGNAL_SQL),
           meta: { generated: new Date().toISOString().slice(0, 10) } };
}

/* --- helpers --------------------------------------------------------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = n => (n == null ? "—" : Math.round(n).toLocaleString("en-US"));
const parseJson = (v, fb) => { if (v == null) return fb; if (typeof v === "object") return v;
  try { return JSON.parse(v); } catch (e) { return fb; } };
const daysTo = iso => iso ? Math.round((new Date(iso + "T00:00:00") - new Date().setHours(0,0,0,0)) / 864e5) : null;
const HEALTH = ["nursing", "allied_health", "medical", "pharmacy"];

function deadlinePill(iso) {
  if (!iso) return '<span class="pill type">no deadline</span>';
  const d = daysTo(iso);
  const cls = d <= 14 ? "urgent" : d <= 45 ? "soon" : "open";
  return `<span class="pill ${cls}">${esc(iso)} · ${d}d</span>`;
}
function copyBtn(text, label) {
  if (!text) return '<span class="org-meta">—</span>';
  return `<button class="copy" data-copy="${esc(text)}">${esc(label || text)}</button>`;
}
document.addEventListener("click", e => {
  const btn = e.target.closest(".copy");
  if (!btn) return;
  navigator.clipboard.writeText(btn.dataset.copy).then(() => {
    const t = btn.textContent; btn.textContent = "copied"; btn.classList.add("copied");
    setTimeout(() => { btn.textContent = t; btn.classList.remove("copied"); }, 1100);
  });
});

/* ---------------------------------------------------------------------------
   The views. Each is a self-contained play with its own columns, its own rows,
   and a one-line brief telling the rep what this list is and how to use it.
   --------------------------------------------------------------------------- */
let VIEWS = [];

function healthFlags(o) {
  const f = parseJson(o.flags, {});
  return HEALTH.filter(k => f[k]);
}
function isHealth(o) { return healthFlags(o).length > 0; }

function buildViews() {
  const contactsByOrg = new Map();
  for (const c of DATA.contacts) {
    if (!contactsByOrg.has(c.org_id)) contactsByOrg.set(c.org_id, []);
    contactsByOrg.get(c.org_id).push(c);
  }
  const orgById = new Map(DATA.orgs.map(o => [o.id, o]));

  /* -- 1. Independent campus stores: the core physical-textbook buyer -------- */
  const storeLeads = [], storeLocked = [];
  for (const o of DATA.orgs) {
    const store = parseJson(o.notes, {}).store;
    if (!store) continue;
    if (store.kind === "managed") { storeLocked.push({ o, store }); continue; }
    if (store.kind === "independent" || store.kind === "external") {
      if (store.email || store.phone || store.store_url) storeLeads.push({ o, store });
    }
  }
  storeLeads.sort((a, b) => (b.store.email ? 1 : 0) - (a.store.email ? 1 : 0) || (b.o.size || 0) - (a.o.size || 0));

  /* -- 2. Live bids: physical materials with a future deadline --------------- */
  const bids = [...DATA.signals].sort((a, b) => (a.deadline || "9999").localeCompare(b.deadline || "9999"));

  /* -- 3. Surplus buyers: Track B counterparties you can reach --------------- */
  const surplus = DATA.orgs
    .filter(o => (o.track === "B" || o.track === "both") && o.status !== "disqualified")
    .map(o => ({ o, contacts: contactsByOrg.get(o.id) || [] }))
    .sort((a, b) => b.contacts.length - a.contacts.length || String(a.o.name).localeCompare(b.o.name));

  /* -- 4. Library accounts: secondary — monographs and course reserves ------- */
  const libraries = DATA.orgs
    .map(o => ({ o, contacts: (contactsByOrg.get(o.id) || []).filter(c => c.role_type === "acquisitions_librarian") }))
    .filter(x => x.contacts.length)
    .sort((a, b) => (b.o.size || 0) - (a.o.size || 0));

  /* -- 5. Locked campuses + federal incumbents: the don't-waste-a-call list --- */
  const incumbents = DATA.orgs
    .filter(o => parseJson(o.notes, {}).federal_total_usd != null && o.status === "disqualified")
    .map(o => ({ o, note: parseJson(o.notes, {}) }))
    .sort((a, b) => b.note.federal_total_usd - a.note.federal_total_usd);

  VIEWS = [
    {
      key: "stores", label: "Campus stores", count: storeLeads.length,
      blurb: "Institutions that run their own store — a local buying decision. Lead with used/bulk pricing on core titles. Stores with an email first, then phone-only. \"Nursing / allied health\" narrows to LWW-priority campuses.",
      head: ["Institution", "State", "Enrollment", "Programs", "Store", "Email", "Phone"],
      rows: storeLeads, render: renderStoreRow, card: cardStore,
      filter: ({ o }, f) => matchOrg(o, f),
      empty: "No independent stores found yet — the campus crawl is still running."
    },
    {
      key: "bids", label: "Live bids", count: bids.length,
      blurb: "Open solicitations for physical books and course materials with a future deadline, soonest first. Electronic subscription renewals are excluded — you cannot fulfil them. Reference numbers copy to clipboard.",
      head: ["Deadline", "Buyer", "Solicitation", "Reference", "Source"],
      rows: bids, render: renderBidRow, card: cardBid,
      filter: (s, f) => matchBid(s, f),
      empty: "Nothing fulfillable is open right now. The pollers run daily; check back tomorrow."
    },
    {
      key: "surplus", label: "Surplus buyers", count: surplus.filter(x => x.contacts.length).length,
      blurb: "Wholesalers, jobbers and buyback programs that purchase overstock. buybacks@ / bulkseller@ mailboxes exist to receive exactly this pitch. Companies without an address need a phone call — their sites block crawlers, not buyers.",
      head: ["Company", "Type", "What they do", "Reach them"],
      rows: surplus, render: renderSurplusRow, card: cardSurplus,
      filter: ({ o }, f) => matchOrg(o, f),
      empty: "No Track B counterparties match."
    },
    {
      key: "libraries", label: "Library accounts", count: libraries.length,
      blurb: "Secondary play: consortium libraries with published acquisitions addresses. They buy monographs and course reserves, not bulk textbooks — pitch reference and health-sciences backlist, not adoption stock.",
      head: ["Institution", "State", "Enrollment", "Consortium", "Acquisitions contact"],
      rows: libraries, render: renderLibraryRow, card: cardLibrary,
      filter: ({ o }, f) => matchOrg(o, f),
      empty: "No library contacts match."
    },
    {
      key: "locked", label: "Do not chase", count: storeLocked.length + incumbents.length,
      blurb: "Campuses whose store is run centrally (Follett, Barnes & Noble College) and federal incumbents holding the subscription contracts. Not leads — this list exists so nobody wastes a week finding that out.",
      head: ["Organization", "Why it's closed", "Detail"],
      rows: [...storeLocked.map(x => ({ kind: "store", ...x })),
             ...incumbents.map(x => ({ kind: "incumbent", ...x }))],
      render: renderLockedRow, card: cardLocked,
      filter: (x, f) => matchOrg(x.o, f),
      empty: "Nothing here matches."
    },
  ];
}

/* --- filtering -------------------------------------------------------------- */
function filters() {
  return { q: $("q").value.trim().toLowerCase(), st: $("state").value, health: $("health").checked };
}
function matchOrg(o, f) {
  if (f.st && o.state !== f.st) return false;
  if (f.health && !isHealth(o)) return false;
  if (f.q) {
    const store = parseJson(o.notes, {}).store || {};
    const hay = `${o.name} ${o.city || ""} ${o.domain || ""} ${store.email || ""}`.toLowerCase();
    if (!hay.includes(f.q)) return false;
  }
  return true;
}
function matchBid(s, f) {
  if (f.st && s.state !== f.st) return false;
  if (f.q && !`${s.title} ${s.org_name || ""} ${s.ref || ""}`.toLowerCase().includes(f.q)) return false;
  return true;
}

/* --- renderers --------------------------------------------------------------- */
function renderStoreRow({ o, store }) {
  return `<tr>
    <td><div class="org-name">${esc(o.name)}</div><div class="org-meta">${esc(o.city || "")}</div></td>
    <td>${esc(o.state || "—")}</td>
    <td class="num">${num(o.size)}</td>
    <td>${healthFlags(o).map(x => `<span class="pill flag">${esc(x.replace("_", " "))}</span>`).join(" ") || '<span class="org-meta">—</span>'}</td>
    <td>${store.store_url ? `<a href="${esc(store.store_url)}" target="_blank" rel="noopener">store site</a>` : "—"}</td>
    <td>${copyBtn(store.email)}</td>
    <td>${copyBtn(store.phone)}</td>
  </tr>`;
}
function cardStore({ o, store }) {
  return `<article class="card">
    <div class="org-name">${esc(o.name)}</div>
    <div class="card-meta">${esc(o.city || "")}${o.state ? ", " + esc(o.state) : ""} · ${num(o.size)} enrolled</div>
    <div class="card-pills">${healthFlags(o).map(x => `<span class="pill flag">${esc(x.replace("_"," "))}</span>`).join("")}</div>
    <div class="act">${store.email ? copyBtn(store.email) : ""} ${store.phone ? copyBtn(store.phone) : ""}
      ${store.store_url ? `<a href="${esc(store.store_url)}" target="_blank" rel="noopener">store site</a>` : ""}</div>
  </article>`;
}

function renderBidRow(s) {
  return `<tr>
    <td>${deadlinePill(s.deadline)}</td>
    <td>${esc(s.org_name || "—")}<div class="org-meta">${esc(s.state || "")}</div></td>
    <td>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}</td>
    <td>${copyBtn(s.ref)}</td>
    <td><span class="pill type">${esc(s.source)}</span></td>
  </tr>`;
}
function cardBid(s) {
  return `<article class="card">
    <div class="org-name">${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}</div>
    <div class="card-meta">${esc(s.org_name || "")}</div>
    <div class="card-pills">${deadlinePill(s.deadline)}<span class="pill type">${esc(s.source)}</span></div>
    <div class="act">${copyBtn(s.ref)}</div>
  </article>`;
}

function renderSurplusRow({ o, contacts }) {
  const reach = contacts.length
    ? contacts.slice(0, 3).map(c => copyBtn(c.email)).join("<br>")
    : `<span class="org-meta">no address published — ${o.domain ? `<a href="https://${esc(o.domain)}" target="_blank" rel="noopener">site</a> +` : ""} phone</span>`;
  return `<tr>
    <td><div class="org-name">${esc(o.name)}</div><div class="org-meta">${esc(o.domain || "")}</div></td>
    <td><span class="pill type">${esc(o.org_type.replace("_", " "))}</span></td>
    <td class="org-meta">${esc(o.segment || "")}</td>
    <td>${reach}</td>
  </tr>`;
}
function cardSurplus({ o, contacts }) {
  return `<article class="card">
    <div class="org-name">${esc(o.name)}</div>
    <div class="card-meta">${esc(o.segment || "")}</div>
    <div class="act">${contacts.slice(0, 2).map(c => copyBtn(c.email)).join(" ")
      || (o.domain ? `<a href="https://${esc(o.domain)}" target="_blank" rel="noopener">${esc(o.domain)}</a>` : "")}</div>
  </article>`;
}

function renderLibraryRow({ o, contacts }) {
  const coops = parseJson(o.coops, []);
  return `<tr>
    <td><div class="org-name">${esc(o.name)}</div><div class="org-meta">${esc(o.city || "")}</div></td>
    <td>${esc(o.state || "—")}</td>
    <td class="num">${num(o.size)}</td>
    <td>${coops.map(x => `<span class="pill type">${esc(x)}</span>`).join(" ") || "—"}</td>
    <td>${contacts.slice(0, 2).map(c => copyBtn(c.email)).join("<br>")}</td>
  </tr>`;
}
function cardLibrary({ o, contacts }) {
  return `<article class="card">
    <div class="org-name">${esc(o.name)}</div>
    <div class="card-meta">${esc(o.city || "")}${o.state ? ", " + esc(o.state) : ""}</div>
    <div class="act">${contacts.slice(0, 2).map(c => copyBtn(c.email)).join(" ")}</div>
  </article>`;
}

function renderLockedRow(x) {
  if (x.kind === "store") {
    return `<tr>
      <td><div class="org-name">${esc(x.o.name)}</div><div class="org-meta">${esc(x.o.state || "")}</div></td>
      <td><span class="pill urgent">store run by ${esc(x.store.operator || "a national operator")}</span></td>
      <td class="org-meta">Buying is central, not on campus${x.store.store_url ? ` — <a href="${esc(x.store.store_url)}" target="_blank" rel="noopener">their storefront</a>` : ""}</td>
    </tr>`;
  }
  return `<tr>
    <td><div class="org-name">${esc(x.o.name)}</div><div class="org-meta">${esc(x.o.state || "")}</div></td>
    <td><span class="pill urgent">holds $${num(x.note.federal_total_usd)} in federal contracts</span></td>
    <td class="org-meta">${esc(x.note.largest_award || "")}</td>
  </tr>`;
}
function cardLocked(x) {
  const why = x.kind === "store"
    ? `store run by ${x.store.operator || "a national operator"}`
    : `holds $${num(x.note.federal_total_usd)} federal`;
  return `<article class="card">
    <div class="org-name">${esc(x.o.name)}</div>
    <div class="card-pills"><span class="pill urgent">${esc(why)}</span></div>
  </article>`;
}

/* --- shell -------------------------------------------------------------------- */
const state = { tab: "stores" };

function render() {
  const f = filters();
  $("tabs").innerHTML = VIEWS.map(v =>
    `<button class="tab" role="tab" aria-selected="${v.key === state.tab}" data-tab="${v.key}">
       ${esc(v.label)}<b>${v.count.toLocaleString()}</b></button>`).join("");
  const view = VIEWS.find(v => v.key === state.tab);
  $("blurb").textContent = view.blurb;

  const visible = view.rows.filter(r => view.filter(r, f));
  $("gridHead").innerHTML = `<tr>${view.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>`;
  $("gridBody").innerHTML = visible.length
    ? visible.slice(0, 500).map(view.render).join("")
    : `<tr><td colspan="${view.head.length}" class="org-meta" style="padding:16px">${esc(view.empty)}</td></tr>`;
  $("cards").innerHTML = visible.slice(0, 200).map(view.card).join("");
  $("countNote").textContent = `${visible.length.toLocaleString()} of ${view.rows.length.toLocaleString()} rows`
    + (visible.length > 500 ? " — showing the first 500." : ".");
}

function wire() {
  $("tabs").addEventListener("click", e => {
    const tab = e.target.closest(".tab");
    if (tab) { state.tab = tab.dataset.tab; render(); }
  });
  ["q", "state", "health"].forEach(id => $(id).addEventListener("input", render));
  $("reset").addEventListener("click", () => {
    $("q").value = ""; $("state").value = ""; $("health").checked = false; render();
  });
}

load().then(() => {
  $("status").hidden = true;
  buildViews();
  const states = [...new Set(DATA.orgs.map(o => o.state).filter(Boolean))].sort();
  $("state").insertAdjacentHTML("beforeend",
    states.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join(""));
  wire();
  render();
  const leads = VIEWS[0].count + VIEWS[2].count;
  $("stamp").textContent = `${leads} workable leads · ${VIEWS[1].count} live bids`;
  $("footer").innerHTML =
    `Campus store operator and contact from each institution's own site; bids from SAM.gov,
     Georgia and Florida procurement portals (physical materials only); surplus buyers from a
     verified trade list; library contacts from OhioLINK. Generated ${esc(DATA.meta.generated || "")}.
     Contacts are organizational mailboxes published by the organizations themselves.`;
}).catch(err => {
  $("status").innerHTML = `<p>Could not load the database.</p><p><code>${esc(err.message)}</code></p>
    <p class="org-meta">Serve this folder over HTTP — <code>python -m http.server</code> from the repo
    root, then open <code>/dashboard/</code>.</p>`;
});
</script>
