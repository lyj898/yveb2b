name: Deploy dashboard to GitHub Pages (opt-in)

# NOT the active deployment path. This repo already serves Pages from the main branch
# with the custom domain in CNAME, so /dashboard/ publishes automatically on push and
# reads the committed db/leads.db.
#
# Run this workflow only if you switch Settings -> Pages -> Source to "GitHub Actions".
# It publishes dashboard/ alone with a pruned leads.db (~7 MB instead of ~12 MB), which
# makes the page load faster but takes the rest of the repo off the domain.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pruned leads.db next to index.html
        run: python dashboard/build_static.py

      - name: Carry the custom domain into the artifact
        run: cp CNAME dashboard/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
