name: Deploy dashboard to GitHub Pages

# Publishes dashboard/ (index.html + leads.db) as a static site. Enable once in
# Settings -> Pages -> Source: GitHub Actions, then every push to main redeploys.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "db/leads.db"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Rebuild so the published leads.db always matches the committed db/leads.db.
      - run: python dashboard/build_static.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
