name: SAM.gov signals (daily)

on:
  schedule:
    - cron: "20 11 * * *"      # 11:20 UTC — after SAM.gov's overnight posting batch
  workflow_dispatch:
    inputs:
      days:
        description: Lookback window in days
        default: "30"

permissions:
  contents: write

concurrency:
  group: leads-db                # every DB-writing workflow shares this lock
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Poll SAM.gov
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: python -m ingest.samgov_poller --days ${{ inputs.days || '30' }}

      - name: Rescore and rebuild the dashboard data
        run: |
          python -m enrich.score
          python dashboard/build_static.py

      - name: Commit refreshed database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/leads.db
          git diff --staged --quiet || git commit -m "SAM.gov refresh $(date -u +%Y-%m-%d)"
          git push
