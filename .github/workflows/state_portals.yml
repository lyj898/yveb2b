name: State procurement portals (daily)

on:
  schedule:
    - cron: "10 12 * * 1-5"     # weekdays; state portals post on business days
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leads-db
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Each state runs independently — one portal being down must not skip the others.
      - name: Georgia
        continue-on-error: true
        run: python -m ingest.state_portals.ga

      - name: Florida
        continue-on-error: true
        run: python -m ingest.state_portals.fl

      - name: Rescore and rebuild the dashboard data
        run: |
          python -m enrich.score
          python dashboard/build_static.py

      - name: Commit refreshed database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/leads.db dashboard/leads.db
          git diff --staged --quiet || git commit -m "State portal refresh $(date -u +%Y-%m-%d)"
          git push
